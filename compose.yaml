# Local DEV stack: Postgres 18, Keycloak (dev realm, users admin/admin and dev/dev) and corntchap built from the
# Containerfile. Not for production (see deploy/).
# Use `just setup` / `just up` / `just ps` / `just logs`: they pick random free ports into .env.dev and load them.
# Plain `docker compose ...` needs KC_PORT, PG_PORT, APP_PORT and PUBLIC_URL in the environment; mise exports
# COMPOSE_ENV_FILES=.env.dev, or pass `--env-file .env.dev`.
# The compose project name defaults to this directory's name, so two checkouts get separate containers and volumes;
# set COMPOSE_PROJECT_NAME to override.
#   just up && docker compose exec corntchap /corntchap init --admin admin   # or simply: just init
services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin      # master-realm console login (not a corntchap user)
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: "http://localhost:${KC_PORT:?run just setup (it picks a random port)}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"  # the app reaches it as keycloak:8080; tokens carry the public localhost issuer
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:${KC_PORT}:8080"]
    volumes: ["./deploy/dev/keycloak:/opt/keycloak/data/import:ro"]   # realm `corntchap`: client + users admin/admin, dev/dev
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: x\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: corn
      POSTGRES_PASSWORD: corn
      POSTGRES_DB: corntchap
    ports: ["127.0.0.1:${PG_PORT:?run `just setup`: it picks a random port}:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]   # PG 18 images keep PGDATA under /var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corn -d corntchap"]
      interval: 3s
      timeout: 3s
      retries: 20

  corntchap:
    build:
      context: .
      dockerfile: Containerfile
    image: ghcr.io/stephane-segning/corntchap:dev
    depends_on:
      db: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://corn:corn@db/corntchap
      PUBLIC_URL: ${PUBLIC_URL:?run `just setup`}   # plain http is only accepted on localhost
      BIND: 0.0.0.0:8080
      AUTO_MIGRATE: "1"
      OIDC_ISSUER: "http://keycloak:8080/realms/corntchap"   # discovery over the compose network
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-corntchap}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-corntchap-dev-secret}
      RUST_LOG: ${RUST_LOG:-info}
    ports: ["127.0.0.1:${APP_PORT:?run `just setup`: it picks a random port}:8080"]

volumes:
  pgdata:
