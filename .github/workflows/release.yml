name: release
on:
  push:
    branches: [main]
    tags: ["v*"]
env:
  IMAGE: ghcr.io/cratestack/corntchap
permissions:
  contents: read
jobs:
  # Build each platform natively (no QEMU), push by digest, then merge into one multi-arch manifest.
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    platform: linux/amd64, pair: amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64, pair: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.pair }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.pair }}
      - name: export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: inspect
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

  cli:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl,  name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: linux-aarch64 }
          - { os: macos-14,         target: aarch64-apple-darwin,       name: darwin-arm64 }
          - { os: macos-15-intel,   target: x86_64-apple-darwin,        name: darwin-x86_64 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.100
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: build
        run: cargo build --release -p corntchap-cli --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
      - name: package
        if: runner.os != 'Windows'
        run: |
          out=corntchap-cli-${{ matrix.name }}
          cp target/${{ matrix.target }}/release/corntchap-cli "$out"
          chmod +x "$out"
          tar czf "$out.tar.gz" "$out"
          shasum -a 256 "$out.tar.gz" > "$out.tar.gz.sha256"
      # Windows: a zip holding corntchap-cli.exe, plus a `<hex>  <file>` checksum line like the tarballs (Scoop reads it)
      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "corntchap-cli-${{ matrix.name }}.zip"
          Copy-Item "target/${{ matrix.target }}/release/corntchap-cli.exe" corntchap-cli.exe
          Compress-Archive -Path corntchap-cli.exe -DestinationPath $out
          $hash = (Get-FileHash -Algorithm SHA256 $out).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD/$out.sha256", "$hash  $out`n")
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: |
            corntchap-cli-${{ matrix.name }}.tar.gz*
            corntchap-cli-${{ matrix.name }}.zip*
          if-no-files-found: error

  github-release:
    needs: cli
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
            install.sh
