name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: corn
          POSTGRES_PASSWORD: corn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U corn" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://corn:corn@127.0.0.1/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      # the web console is built first: cargo embeds console/dist into the server binary
      - name: console (install, typecheck, lint, build)
        working-directory: console
        run: |
          pnpm install --frozen-lockfile
          npx --yes @cratestack/cli@0.20.6 generate-typescript --schema ../crates/server/schema/corntchap.cstack --out src/gen --package-name @corntchap/api --base-path /api/v2 --refine
          pnpm typecheck
          pnpm lint
          pnpm build
      - uses: dtolnay/rust-toolchain@1.100   # same as rust-toolchain.toml
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: just clippy
      - run: just test
      - run: just e2e
