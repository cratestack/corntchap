name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  # corntchap-cli ships a Windows build (Scoop); catch breakage here, not on the tag.
  windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100 (branch, not a tag)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build -p corntchap-cli
      - run: cargo test -p corntchap-cli
      - run: cargo build --release -p corntchap-cli   # what the release job builds

  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: corn
          POSTGRES_PASSWORD: corn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U corn" --health-interval 5s
          --health-timeout 5s --health-retries 10
      rustfs:   # S3-compatible storage for tests/files.rs
        image: rustfs/rustfs:1.0.6
        env:
          RUSTFS_ACCESS_KEY: corntchap
          RUSTFS_SECRET_KEY: corntchap-ci-secret
        ports: ["9000:9000"]
    env:
      TEST_DATABASE_ADMIN_URL: postgres://corn:corn@127.0.0.1/postgres
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY: corntchap
      S3_SECRET_KEY: corntchap-ci-secret
    steps:
      - uses: actions/checkout@v5
      # A migration that has shipped is never edited: databases that applied it would refuse to start.
      - name: migrations are append-only
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          edited=$(git diff --name-only --diff-filter=MDR "$BASE" HEAD -- crates/server/migrations)
          if [ -n "$edited" ]; then
            echo "::error::existing migrations were edited or removed: $edited. Add a new migration instead."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      # the web console is built first: cargo embeds console/dist into the server binary
      - name: console (install, typecheck, lint, build)
        working-directory: console
        run: |
          pnpm install --frozen-lockfile
          npx --yes @cratestack/cli@0.20.6 generate-typescript --schema ../crates/server/schema/corntchap.cstack --out src/gen --package-name @corntchap/api --base-path /api/v2 --refine
          pnpm typecheck
          pnpm lint
          pnpm build
      - uses: dtolnay/rust-toolchain@1.100   # same as rust-toolchain.toml
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: just clippy
      - run: just test
      - run: just e2e
