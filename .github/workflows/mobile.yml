name: mobile
# The Tauri app shell in apps/mobile. Manual or on an `app-v*` tag; never on push to a branch, and the
# server's CI never builds it. Secrets are optional: without them the jobs make debug/unsigned builds
# and upload nothing. Secret names and how to produce them: apps/mobile/PUBLISHING.md.
#
#   Android signing:  ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
#   Play upload:      PLAY_SERVICE_ACCOUNT_JSON
#   iOS signing:      IOS_CERTIFICATE, IOS_CERTIFICATE_PASSWORD, IOS_MOBILE_PROVISION, APPLE_DEVELOPMENT_TEAM
#   TestFlight:       APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_API_KEY_P8
#
# Versions: the name comes from the tag (app-v0.1.2 -> 0.1.2), or from tauri.conf.json on a manual run.
# The Android versionCode and the iOS build number are github.run_number (always increasing).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to Google Play (internal testing) and TestFlight (needs the secrets)"
        type: boolean
        default: false
  push:
    tags: ["app-v*"]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  # A tag push always publishes; a manual run publishes only when the input is ticked.
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
defaults:
  run:
    working-directory: apps/mobile
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The runner image ships the Android SDK ($ANDROID_HOME). `android-actions/setup-android` is not
      # used: its default `sdkmanager tools` no longer exists.
      - name: SDK platform, build tools and NDK
        working-directory: .
        run: |
          set -euo pipefail
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100 (branch, not a tag)
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/mobile/src-tauri
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in apps/mobile/package.json
        with:
          package_json_file: apps/mobile/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Versions
        id: ver
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then
            v="${GITHUB_REF_NAME#app-v}"
          else
            v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version '$v' is not x.y.z"; exit 1; }
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "config={\"version\":\"$v\",\"bundle\":{\"android\":{\"versionCode\":${GITHUB_RUN_NUMBER}}}}" >> "$GITHUB_OUTPUT"
          echo "Android version $v, versionCode ${GITHUB_RUN_NUMBER}"
      - name: Build the picker UI
        run: pnpm build
      - name: Generate the Android project (not committed)
        run: pnpm android:init --ci
      - name: Debug APK (no signing secrets)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: pnpm android:build --apk --debug --config '${{ steps.ver.outputs.config }}'
      - name: Wire up release signing (Tauri 2 Android signing guide)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          gen=src-tauri/gen/android
          ks="$RUNNER_TEMP/upload-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ks"
          # Gitignored; read by the signing config below. A PKCS12 keystore has one password for store and key.
          {
            echo "password=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "storeFile=${ks}"
          } > "$gen/keystore.properties"
          gradle="$gen/app/build.gradle.kts"
          perl -0pi -e 's/\A/import java.io.FileInputStream\nimport java.util.Properties\n\n/' "$gradle"
          perl -0pi -e 's/(\n\s*)buildTypes \{/$1signingConfigs {\n        create("release") {\n            val props = Properties()\n            props.load(FileInputStream(rootProject.file("keystore.properties")))\n            keyAlias = props["keyAlias"] as String\n            keyPassword = props["password"] as String\n            storeFile = file(props["storeFile"] as String)\n            storePassword = props["password"] as String\n        }\n    }\n$1buildTypes {/' "$gradle"
          perl -0pi -e 's/(getByName\("release"\) \{)/$1\n            signingConfig = signingConfigs.getByName("release")/' "$gradle"
          grep -q 'signingConfigs.getByName("release")' "$gradle" && grep -q 'create("release")' "$gradle" \
            || { echo "could not patch $gradle"; cat "$gradle"; exit 1; }
      - name: Signed release AAB and APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: pnpm android:build --aab --apk --config '${{ steps.ver.outputs.config }}'
      - name: Locate the AAB
        id: aab
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: echo "path=$(ls "$PWD"/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab)" >> "$GITHUB_OUTPUT"
      # The very first AAB of a new app must be uploaded by hand in Play Console (PUBLISHING.md, part 1).
      - name: Upload to Google Play (internal testing)
        if: env.PUBLISH == 'true' && env.ANDROID_KEYSTORE_BASE64 != '' && env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: digital.camer.corntchap
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: internal
          status: completed
          releaseName: ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" src-tauri/gen/android/keystore.properties
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corntchap-android
          path: |
            apps/mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            apps/mobile/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100 (branch, not a tag)
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/mobile/src-tauri
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in apps/mobile/package.json
        with:
          package_json_file: apps/mobile/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      # `tauri ios init` needs an Apple team id even for a simulator build: without the secret the job stops
      # here with a notice instead of failing (Android does not need anything).
      - name: Apple team id
        if: env.APPLE_DEVELOPMENT_TEAM == ''
        run: |
          echo "::notice title=iOS skipped::Set the APPLE_DEVELOPMENT_TEAM secret (10-character Team ID, see apps/mobile/PUBLISHING.md) to build for iOS."
          exit 0
      - run: pnpm install --frozen-lockfile
        if: env.APPLE_DEVELOPMENT_TEAM != ''
      - name: Versions
        id: ver
        if: env.APPLE_DEVELOPMENT_TEAM != ''
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then
            v="${GITHUB_REF_NAME#app-v}"
          else
            v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version '$v' is not x.y.z"; exit 1; }
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "config={\"version\":\"$v\",\"bundle\":{\"iOS\":{\"bundleVersion\":\"${GITHUB_RUN_NUMBER}\"}}}" >> "$GITHUB_OUTPUT"
          echo "iOS version $v, build ${GITHUB_RUN_NUMBER}"
      - name: Build the picker UI
        if: env.APPLE_DEVELOPMENT_TEAM != ''
        run: pnpm build
      - name: Generate the Xcode project (not committed)
        if: env.APPLE_DEVELOPMENT_TEAM != ''
        run: pnpm ios:init --ci
      - name: Simulator build (no signing secrets)
        if: env.APPLE_DEVELOPMENT_TEAM != '' && env.IOS_CERTIFICATE == ''
        # Best effort: proves the project and Rust code build for iOS. Nothing installable on a device.
        continue-on-error: true
        run: pnpm ios:build --debug --target aarch64-sim --config '${{ steps.ver.outputs.config }}'
      # Tauri's iOS signing guide: with IOS_CERTIFICATE, IOS_CERTIFICATE_PASSWORD and IOS_MOBILE_PROVISION in
      # the environment, the CLI imports the certificate and installs the profile itself.
      - name: Signed IPA for App Store Connect
        if: env.IOS_CERTIFICATE != ''
        run: pnpm ios:build --export-method app-store-connect --config '${{ steps.ver.outputs.config }}'
      - name: Locate the IPA
        id: ipa
        if: env.IOS_CERTIFICATE != ''
        run: echo "path=$(find "$PWD/src-tauri/gen/apple/build" -name '*.ipa' | head -n1)" >> "$GITHUB_OUTPUT"
      - name: Upload to TestFlight
        if: env.PUBLISH == 'true' && env.IOS_CERTIFICATE != '' && env.APPLE_API_KEY_P8 != ''
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file "${{ steps.ipa.outputs.path }}" \
            --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corntchap-ios
          path: |
            apps/mobile/src-tauri/gen/apple/build/**/*.ipa
            apps/mobile/src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn
