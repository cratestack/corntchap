name: mobile
# The Tauri app shell in apps/mobile. Manual or on an `app-v*` tag; never on push, and the server's
# CI never builds it. Secrets are optional: without them the jobs make unsigned/debug builds.
#   Android signing: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   iOS signing:     APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_PROVISIONING_PROFILE (base64),
#                    APPLE_DEVELOPMENT_TEAM (10-char team id)
# See apps/mobile/README.md.
on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
defaults:
  run:
    working-directory: apps/mobile
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      NDK_VERSION: 27.2.12479018
      BUILD_TOOLS: 35.0.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: SDK platform, build tools and NDK
        run: sdkmanager "platforms;android-35" "build-tools;${BUILD_TOOLS}" "ndk;${NDK_VERSION}"
      - name: NDK_HOME
        run: echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100 (branch, not a tag)
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/mobile/src-tauri
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/mobile/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate the Android project (not committed)
        run: pnpm android:init --ci
      - name: Debug APK (no signing secrets)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: pnpm android:build --apk --debug
      - name: Release APK and AAB (unsigned, then signed with your keystore)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          pnpm android:build --apk --aab
          ks="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ks"
          out=src-tauri/gen/android/app/build/outputs
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          apk=$(ls "$out"/apk/universal/release/*-unsigned.apk)
          "$bt/zipalign" -f -p 4 "$apk" "$out/corntchap-aligned.apk"
          "$bt/apksigner" sign --ks "$ks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$out/corntchap-release.apk" "$out/corntchap-aligned.apk"
          aab=$(ls "$out"/bundle/universalRelease/*.aab)
          jarsigner -keystore "$ks" -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD \
            -signedjar "$out/corntchap-release.aab" "$aab" "$ANDROID_KEY_ALIAS"
          rm -f "$ks" "$out/corntchap-aligned.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corntchap-android
          path: |
            apps/mobile/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            apps/mobile/src-tauri/gen/android/app/build/outputs/corntchap-release.*
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100 (branch, not a tag)
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/mobile/src-tauri
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/mobile/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate the Xcode project (not committed)
        run: pnpm ios:init --ci
      - name: Simulator build (no signing secrets)
        if: env.APPLE_CERTIFICATE == ''
        # Best effort: proves the project and Rust code build for iOS. Nothing installable on a device.
        continue-on-error: true
        run: pnpm ios:build --debug --target aarch64-sim
      - name: Import signing certificate and profile
        if: env.APPLE_CERTIFICATE != ''
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/build.keychain-db"; pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$APPLE_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$pw" "$kc"
          security list-keychains -d user -s "$kc" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APPLE_PROVISIONING_PROFILE" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/corntchap.mobileprovision"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Signed build for App Store Connect / TestFlight
        if: env.APPLE_CERTIFICATE != ''
        run: pnpm ios:build --export-method app-store-connect
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corntchap-ios
          path: |
            apps/mobile/src-tauri/gen/apple/build/**/*.ipa
            apps/mobile/src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn
