# Not a member of the server workspace (see `exclude` in the root Cargo.toml): the server's
# builds and CI never compile Tauri. This crate has its own lockfile.
[workspace]

[package]
name = "corntchap-app"
version = "0.1.0"
description = "corntchap mobile and desktop shell: loads the console from your server"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "corntchap_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.5"
tauri-plugin-deep-link = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
