[package]
name = "corntchap-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.2"
clap = { version = "4.6.9", features = ["derive", "env"] }
dirs = "7.0.0"
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["json", "stream", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shellexpand = "3.1.2"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
