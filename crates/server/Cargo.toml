[package]
name = "corntchap"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["console"]
# Embed console/dist (the web console) in the binary; without it a "console not built" page is served.
console = ["dep:rust-embed"]

[dependencies]
cratestack = { package = "cratestack-pg", version = "0.20.6", features = ["mcp"] }
authkestra = { version = "0.15.3", features = ["axum", "oidc", "resource"] }
async-trait = "0.1"
http = "1"
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
futures = "0.3.34"
hex = "0.4.3"
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
serde_urlencoded = "0.7.1"
rust-embed = { version = "8", optional = true, features = ["interpolate-folder-path", "debug-embed", "mime-guess"] }

[dev-dependencies]
jsonwebtoken = "11.1"
