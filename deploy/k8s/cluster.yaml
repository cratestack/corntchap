apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: corntchap-db
spec:
  instances: 2
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: corntchap
      owner: corntchap
  backup:
    barmanObjectStore:
      # Adjust to your object store; credentials come from the referenced secret.
      destinationPath: s3://CHANGE-ME-BUCKET/corntchap
      s3Credentials:
        accessKeyId:
          name: corntchap-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: corntchap-backup-s3
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
    retentionPolicy: 14d
