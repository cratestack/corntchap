apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: corntchap
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt   # CHANGE-ME or remove if you manage TLS secrets yourself
    # SSE and long-poll (/mcp, /api/v1/relay/stream) need unbuffered, long-lived responses.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [corntchap.example.com]   # CHANGE-ME
      secretName: corntchap-tls
  rules:
    - host: corntchap.example.com      # CHANGE-ME
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: corntchap
                port:
                  name: http
