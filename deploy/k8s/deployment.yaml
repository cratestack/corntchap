apiVersion: apps/v1
kind: Deployment
metadata:
  name: corntchap
spec:
  replicas: 2
  selector:
    matchLabels:
      app: corntchap
  template:
    metadata:
      labels:
        app: corntchap
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: corntchap
          image: ghcr.io/cratestack/corntchap:latest
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: corntchap-db-app   # created by CNPG: <cluster>-app
                  key: uri
            - name: PUBLIC_URL
              value: https://corntchap.example.com   # CHANGE-ME: must match the Ingress host
            - name: BIND
              value: 0.0.0.0:8080
            - name: AUTO_MIGRATE
              value: "1"
            - name: OIDC_ISSUER
              value: https://keycloak.example.com/realms/corntchap   # CHANGE-ME: your realm's issuer URL
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: corntchap-oidc
                  key: client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: corntchap-oidc
                  key: client-secret
            # Files (optional): any S3-compatible store (RustFS, MinIO, S3, R2...). Leave out to disable uploads.
            - name: S3_ENDPOINT
              value: http://rustfs.storage.svc:9000   # CHANGE-ME: reached by the server
            - name: S3_PUBLIC_ENDPOINT
              value: https://files.example.com        # CHANGE-ME: reached by browsers and agents (presigned URLs)
            - name: S3_BUCKET
              value: corntchap
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: corntchap-s3, key: access-key }
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: corntchap-s3, key: secret-key }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
