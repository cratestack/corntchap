# Dev dependencies: `mise install` then `mise run <task>` (tasks wrap the Justfile).
# Also needed on the host: Docker and python3 (scripts/devenv.py, e2e, mcp-check). node + pnpm build the web console (console/).
# Rust is pinned to 1.100, same as rust-toolchain.toml (workspace rust-version 1.98 is only the minimum cratestack needs).
[tools]
rust = { version = "1.100", components = "rustfmt,clippy", targets = "x86_64-unknown-linux-musl" }
just = "latest"
node = "lts"
pnpm = "latest"

# Plain `docker compose ...` in this repo then reads the random ports written by `just setup`.
[env]
COMPOSE_ENV_FILES = ".env.dev"

[tasks.db]
description = "Start Postgres + Keycloak (docker compose)"
run = "just infra"

[tasks.build]
run = "just build"

[tasks.test]
description = "Unit + integration tests (needs Postgres)"
depends = ["db"]
run = "just test"

[tasks.e2e]
description = "Real-binary end-to-end run"
depends = ["db"]
run = "just e2e"

[tasks.check]
description = "fmt + clippy"
run = ["just fmt", "just clippy"]

[tasks.up]
description = "Whole stack in containers"
run = "just up"
